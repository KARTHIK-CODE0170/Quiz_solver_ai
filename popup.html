<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz AI — Coursera Solver</title>
  <link rel="stylesheet" href="popup.css" />
  <style>
  </style>
</head>

<body>
  <div class="container">

    <!-- ── Header ──────────────────────────────────────────── -->
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <img src="icons/bankai.png" style="width: 100%; height: 100%; border-radius: 10px; object-fit: cover;" alt="Bankai Icon" />
        </div>
        <div class="logo-text">
          <span class="logo-title">Quiz AI Solver</span>
          <span class="logo-sub"><span class="status-dot active" id="status-dot"></span> <span
              id="status-text">Ready</span></span>
        </div>
      </div>
    </div>

    <!-- ── Actions ──────────────────────────────────────────── -->
    <div class="section">
      <div class="label"><span>Actions (Runs on Active Tab)</span></div>

      <!-- Primary: Full pipeline -->
      <button class="btn-auto" id="auto-solve-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
        </svg>
        Auto-Solve All Tasks
      </button>

      <!-- Secondary: Just this quiz -->
      <button class="btn-primary" id="solve-all-btn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
        Solve Current Page
      </button>
    </div>

    <!-- ── Settings ─────────────────────────────────────────── -->
    <div class="section">
      <div class="label"><span>Settings</span></div>
      
      <div class="setting-row">
        <label for="ai-selector">Preferred AI:</label>
        <select id="ai-selector" class="dropdown">
          <option value="gemini">Google Gemini</option>
          <option value="copilot">Microsoft Copilot</option>
          <option value="chatgpt">ChatGPT</option>
          <option value="claude">Claude</option>
        </select>
      </div>

      <div class="setting-row">
        <label for="bg-mode-toggle" class="checkbox-label">
          <input type="checkbox" id="bg-mode-toggle">
          Run silently in background
        </label>
      </div>
    </div>

    <!-- ── Feature Pills (emoji — never overflow) ─────────── -->
    <div class="capability-strip">
      <div class="cap-item">
        <span class="cap-dot">⚡</span>
        <span>Instant AI</span>
      </div>
      <div class="cap-divider"></div>
      <div class="cap-item">
        <span class="cap-dot">🔓</span>
        <span>Free</span>
      </div>
      <div class="cap-divider"></div>
      <div class="cap-item">
        <span class="cap-dot">✓</span>
        <span>Auto-submits</span>
      </div>
    </div>

    <!-- ── Footer ───────────────────────────────────────────── -->
    <div class="footer">
      <div class="footer-author">
        <span>Made by</span>
        <a href="https://pin.it/1yUKUOkZF" target="_blank" class="author-link">BATMAN</a>
      </div>
      <span class="footer-version">v6.1.1 WEB-UI</span>
    </div>

  </div>
  <script src="popup.js"></script>
</body>

</html>
